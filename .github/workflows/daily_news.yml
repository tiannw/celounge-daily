name: 每日时政自动提取

on:
  schedule:
    # 每天 12:30 UTC = 20:30 北京时间（新闻联播 19:00 播出后）
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests openai

      - name: Run daily news extractor
        env:
          CELOUNGE_DEEPSEEK_API_KEY: ${{ secrets.CELOUNGE_DEEPSEEK_API_KEY }}
        run: python tools/daily_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/daily/*.json
          if git diff --cached --quiet; then
            echo "no new cards today"
          else
            git commit -m "chore(data): 更新每日时政 $(date +%Y-%m-%d)"
            git push
          fi
